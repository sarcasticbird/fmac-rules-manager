<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Outer box / container -->
  <rect x="8" y="20" width="80" height="60" rx="6" ry="6"
        fill="none" stroke="#4a90d9" stroke-width="5"/>
  <!-- Lid / top flap -->
  <rect x="8" y="20" width="80" height="18" rx="6" ry="6"
        fill="#4a90d9"/>
  <!-- Lid bottom edge (covers rounded bottom of lid rect) -->
  <rect x="8" y="30" width="80" height="8"
        fill="#4a90d9"/>
  <!-- Tab on lid -->
  <rect x="36" y="12" width="24" height="12" rx="4" ry="4"
        fill="#4a90d9"/>
  <!-- Horizontal rule lines inside box -->
  <line x1="20" y1="54" x2="76" y2="54"
        stroke="#4a90d9" stroke-width="3" stroke-linecap="round"/>
  <line x1="20" y1="66" x2="76" y2="66"
        stroke="#4a90d9" stroke-width="3" stroke-linecap="round"/>
</svg>
